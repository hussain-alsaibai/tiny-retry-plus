[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-retry-plus"
version = "0.1.0"
description = "Zero-dependency retry with jitter, adaptive backoff, and circuit-breaker integration."
readme = "README.md"
authors = [
    { name = "Hussain AlSaibai", email = "hussain.alsaibai@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/hussain-alsaibai/tiny-retry-plus"
Repository = "https://github.com/hussain-alsaibai/tiny-retry-plus"
Issues = "https://github.com/hussain-alsaibai/tiny-retry-plus/issues"

[project.scripts]
test = "pytest:main"

[tool.setuptools]
py-modules = ["tiny_retry_plus"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "network: tests that require live network access (httpbin.org). Skipped automatically if unreachable.",
]
